openapi: 3.0.3
info:
  title: Military Task Manager API
  version: 1.0.0
  description: REST API for user authentication and personal task management. The API supports JWT authentication, role-based
    authorization, task ownership, pagination, filtering, sorting, search, and task archiving.
servers:
- url: http://localhost:5000
  description: Local development server
tags:
- name: Auth
  description: Registration and login
- name: Users
  description: Current user endpoints
- name: Tasks
  description: Authenticated user task management
- name: Admin
  description: Administrator-only endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the access token returned by POST /api/auth/login.
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: MongoDB ObjectId of the task.
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
        example: 66a7f65f2f96c40c4dff1234
    Page:
      name: page
      in: query
      description: Page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      description: Number of tasks per page.
      schema:
        type: integer
        minimum: 1
        default: 10
    SortBy:
      name: sortBy
      in: query
      description: Field used to sort tasks.
      schema:
        type: string
        enum:
        - createdAt
        - updatedAt
        - dueDate
        - status
        - priority
        default: createdAt
    SortOrder:
      name: sortOrder
      in: query
      description: Sort direction.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    Search:
      name: search
      in: query
      description: Case-insensitive search in task title and description.
      schema:
        type: string
    TitleFilter:
      name: title
      in: query
      description: Case-insensitive partial title match.
      schema:
        type: string
    DescriptionFilter:
      name: description
      in: query
      description: Case-insensitive partial description match.
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      description: Filter by task status.
      schema:
        type: string
        enum:
        - pending
        - in_progress
        - completed
        - cancelled
    PriorityFilter:
      name: priority
      in: query
      description: Filter by task priority.
      schema:
        type: string
        enum:
        - low
        - medium
        - high
        - critical
    CategoryFilter:
      name: category
      in: query
      description: Filter by task category.
      schema:
        type: string
        enum:
        - general
        - training
        - logistics
        - maintenance
        - operation
    ArchivedFilter:
      name: isArchived
      in: query
      description: Filter by archive state.
      schema:
        type: boolean
  schemas:
    User:
      type: object
      required:
      - _id
      - name
      - email
      - role
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 66a7f65f2f96c40c4dff1234
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Denis
        email:
          type: string
          format: email
          example: denis@example.com
        role:
          type: string
          enum:
          - user
          - admin
          example: user
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurrentUser:
      type: object
      required:
      - id
      - name
      - email
      - role
      properties:
        id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 66a7f65f2f96c40c4dff1234
        name:
          type: string
          example: Denis
        email:
          type: string
          format: email
          example: denis@example.com
        role:
          type: string
          enum:
          - user
          - admin
    Task:
      type: object
      required:
      - _id
      - title
      - status
      - priority
      - category
      - isArchived
      - owner
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 66a7f65f2f96c40c4dff1234
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Inspect equipment
        description:
          type: string
          maxLength: 1000
          example: Inspect assigned equipment before training.
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - cancelled
          default: pending
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          default: medium
        category:
          type: string
          enum:
          - general
          - training
          - logistics
          - maintenance
          - operation
          default: general
        dueDate:
          type: string
          format: date-time
          nullable: true
        isArchived:
          type: boolean
          default: false
        owner:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 66a7f65f2f96c40c4dff1234
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
      - page
      - perPage
      - totalItems
      - hasNextPage
      - hasPreviousPage
      - totalPages
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 24
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false
        totalPages:
          type: integer
          example: 3
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Denis
        email:
          type: string
          format: email
          example: denis@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: StrongPassword123
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: denis@example.com
        password:
          type: string
          format: password
          example: StrongPassword123
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - dueDate
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Inspect equipment
        description:
          type: string
          maxLength: 1000
          example: Inspect all assigned equipment.
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - cancelled
          default: pending
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          default: medium
        category:
          type: string
          enum:
          - general
          - training
          - logistics
          - maintenance
          - operation
          default: general
        dueDate:
          type: string
          format: date-time
          example: '2026-08-05T09:00:00.000Z'
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - cancelled
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        category:
          type: string
          enum:
          - general
          - training
          - logistics
          - maintenance
          - operation
        dueDate:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Task not found
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        properties:
          errors:
            type: array
            items:
              type: string
            example:
            - Email must be a valid email address
    RouteNotFoundError:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: Route not found
  responses:
    BadRequest:
      description: Invalid request data or invalid task id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: Invalid or expired token
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            message: Forbidden
    TaskNotFound:
      description: Task does not exist or does not belong to the current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Task with current ID not found
    Conflict:
      description: A user with this email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            message: Email is used
    TooManyRequests:
      description: Authentication request limit exceeded.
      content:
        text/plain:
          schema:
            type: string
            example: Too Many Requests
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            message: Internal server error
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new user
      description: Creates a user with the default role `user`. The password is stored as a bcrypt hash and is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Registration is completed
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in
      description: Validates credentials and returns a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Logged in
                  data:
                    type: object
                    required:
                    - user
                    - accessToken
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        description: JWT access token.
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Incorrect email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Email or password is wrong
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
      - Users
      summary: Get the current user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Current user
                  data:
                    $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks:
    get:
      tags:
      - Tasks
      summary: Get the current user tasks
      description: Returns only tasks owned by the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/DescriptionFilter'
      - $ref: '#/components/parameters/StatusFilter'
      - $ref: '#/components/parameters/PriorityFilter'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/ArchivedFilter'
      responses:
        '200':
          description: Paginated task list.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                - pagination
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Tasks
      summary: Create a task
      description: Creates a task owned by the authenticated user. The client cannot set the owner field.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks/{taskId}:
    get:
      tags:
      - Tasks
      summary: Get a task by id
      description: Returns the task only when it belongs to the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Successfully get a task
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Tasks
      summary: Update a task
      description: Updates one or more allowed fields of a task owned by the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Tasks
      summary: Delete a task
      description: Deletes a task owned by the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task deleted successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks/{taskId}/archive:
    patch:
      tags:
      - Tasks
      summary: Archive a task
      description: Sets `isArchived` to `true` for a task owned by the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task archived successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Successfully archived task
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/admin/tasks:
    get:
      tags:
      - Admin
      summary: Get all users tasks
      description: Returns tasks belonging to all users. Requires the `admin` role.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/DescriptionFilter'
      - $ref: '#/components/parameters/StatusFilter'
      - $ref: '#/components/parameters/PriorityFilter'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/ArchivedFilter'
      responses:
        '200':
          description: Paginated list of all tasks.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                - pagination
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
